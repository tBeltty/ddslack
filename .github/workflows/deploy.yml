name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only deploys queue behind each other; a pull request never joins this group.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      VPS_DEPLOY_HOST: ${{ secrets.VPS_DEPLOY_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      CLOUDFLARED_VERSION: 2026.10.7
      CLOUDFLARED_SHA256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
    steps:
      - uses: actions/checkout@v4
      - name: Package the release
        run: tar -czf "$RUNNER_TEMP/release.tgz" --exclude=.git --exclude=node_modules --exclude='.env*' --exclude=./data .
      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: SSH config
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/vps_deploy && chmod 600 ~/.ssh/vps_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps-deploy
            HostName $VPS_DEPLOY_HOST
            User $VPS_DEPLOY_USER
            IdentityFile ~/.ssh/vps_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
      - name: Upload and publish
        run: |
          id=$(ssh vps-deploy upload < "$RUNNER_TEMP/release.tgz")
          echo "upload id: $id"
          ssh vps-deploy publish "$id"
