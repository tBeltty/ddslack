name: Bug report
description: Something in Dice Companion does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Channel
        - Thread
        - Huddle chat
        - Home tab
        - Install page
        - Self-hosted copy
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Slack client
      options:
        - Desktop app
        - Browser
        - iOS
        - Android
  - type: textarea
    id: details
    attributes:
      label: Screenshots or logs
      description: Remove tokens, secrets and private messages first.
